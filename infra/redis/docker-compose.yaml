services:
  redis:
    image: redis:7-alpine
    container_name: ratelimit-redis
    restart: always
    ports:
      - "0.0.0.0:6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    mem_limit: 256m

volumes:
  redis-data:
